<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">

  <title>Frontend Mentor | Contact form</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution {
      font-size: 0.6875rem;
      text-align: center;
    }

    .attribution a {
      color: hsl(228, 45%, 44%);
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>
      Contact Us
    </h1>
    <form action="#" method="get">
      <div class="first-name form-item">
        <label for="fname">First Name <span>*</span></label>
        <input id="fname" name="fname" type="text" required>
      </div>
      <div class="last-name form-item">
        <label for="lname">Last Name <span>*</span></label>
        <input id="lname" name="lname" type="text" required>
      </div>
      <div class="email-field form-item">
        <label for="user_email">Email Address <span>*</span></label>
        <input id="user_email" name="user_email" type="email" required>
      </div>
      <fieldset class="query-field form-item">
        <legend>Query Type <span>*</span></legend>
        <input type="radio" id="general-enquiry" name="query-type" value="general-enquiry" required>
        <label for="general-enquiry">General Enquiry</label>
        <input type="radio" name="query-type" id="support-requiest" value="support-requiest" required>
        <label for="support-requiest">Support Request</label>
      </fieldset>
      <div class="message-field form-item">
        <label for="message">Message <span>*</span></label>
        <textarea name="message" id="message"></textarea>
      </div>
      <div class="consent-field form-item">
        <input type="checkbox" id="user_consent" name="user_consent" required>
        <label for="user_consent">I consent to being contacted by the team <span>*</span></label>
      </div>
      <div class="submit-button-field form-item">
        <button>Submit</button>
      </div>
    </form>
  </div>

</body>

</html>
